version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: beartracks
      POSTGRES_USER: beartracks
      POSTGRES_PASSWORD: beartracks
    ports:
      - "5432:5432"
  db_test:
    image: postgres:16
    environment:
      POSTGRES_DB: beartracks_test
      POSTGRES_USER: beartracks
      POSTGRES_PASSWORD: beartracks
    ports:
      - "5433:5432"
